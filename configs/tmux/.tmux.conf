# TPM and plugins (must be at top before run)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'

# Catppuccin theme config
set -g @catppuccin_flavor 'frappe'

# Reload config with C-b r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Respawn dead pane (re-run its original command). Pairs with remain-on-exit.
bind R respawn-pane -k

# Workspace launcher — fzf picker for layout, repo, and agent (prefix + W)
bind W display-popup -E -w 70% -h 60% "fish -i -c ws"

# Mouse support
set -g mouse off

# Status bar
set -g status on
set -g status-position top

# Pane border highlighting (catppuccin frappe colors)
set -g pane-border-style "fg=#51576d"
set -g pane-active-border-style "fg=#8caaee"
set -g pane-border-status top
set -g pane-border-format " #[bold]#P #T #[nobold](#{pane_current_command}) "

# Pane switching via vim-tmux-navigator (Ctrl+h/j/k/l, no prefix needed)
set -g @vim_navigator_mapping_left "C-h"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_prev ""

# Clipboard
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
