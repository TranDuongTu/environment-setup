# TPM and plugins (must be at top before run)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# Catppuccin theme config — the installed plugin reads 'flavor' (US spelling;
# newer catppuccin releases use 'flavour', so keep whichever matches ~/.tmux/plugins/tmux)
# Mocha matches the nvim colorscheme.
set -g @catppuccin_flavor 'mocha'

# Rounded window pills (built-in catppuccin v2 'rounded' style):
# index on the left; window name text uses the catppuccin defaults (#W).
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"

# Reload config with C-b r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Respawn dead pane (re-run its original command). Pairs with remain-on-exit.
bind R respawn-pane -k

# Workspace launcher — fzf picker for layout, repo, and agent (prefix + W)
bind W display-popup -E -w 70% -h 60% "fish -i -c ws"

# File search (prefix + f) — fzf popup over ripgrep's file list (.gitignored
# files respected); the pick opens in nvim in a new window of this session.
bind f display-popup -E -w 90% -h 80% -d '#{pane_current_path}' \
  "~/.config/tmux/scripts/file-search.sh"

# Mouse support (drag highlights text, wheel scrolls history)
set -g mouse on

# Status bar
set -g status on
set -g status-position top

# Pane border highlighting (catppuccin frappe colors)
set -g pane-border-style "fg=#51576d"
set -g pane-active-border-style "fg=#8caaee"
set -g pane-border-status top
set -g pane-border-format " #[bold]#P #{?@role,#{@role},#T} #[nobold](#{pane_current_command}) "

# Pane switching via vim-tmux-navigator (Ctrl+h/j/k/l, no prefix needed)
set -g @vim_navigator_mapping_left "C-h"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_prev ""

# Clipboard — auto-copy to system clipboard on mouse-highlight release, and 'y' in copy mode
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard -i"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard -i"

# Session persistence (tmux-resurrect + tmux-continuum)
# prefix + C-s saves all sessions, prefix + C-r restores them (resurrect defaults).
# Continuum auto-saves every 15 min and restores the last snapshot when the
# tmux server starts, so sessions survive machine restarts with no manual save.
set -g @continuum-restore on

# tmux-sessionx — session switcher/manager popup (prefix + o)
# fzf list of all sessions with previews; create/rename/delete/kill.
# New-session path picker targets the workspace repos dir. Zoxide mode is
# off until zoxide is installed (@sessionx-zoxide-mode on enables it).
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/projects'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-filter-current 'false'

# tmux-floax — persistent floating scratch shell (prefix + p)
# Unlike the ephemeral prefix+W launcher popup, this float survives window
# switches (handy for parking a server or agent). Catppuccin frappe colors
# match the status bar theme.
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-change-path 'true'
set -g @floax-border-color '#8caaee'
set -g @floax-text-color '#e5c890'

# Status bar refresh cadence — controls how often #() shell calls in the
# status (battery scripts) and the battery/cpu values re-evaluate.
set -g status-interval 5

# Status line layout: session-name pill on the LEFT (the window list follows
# it), then the pane's current path + battery on the right.
# Reset both sides before appending — `set -ag` compounds across reloads
# (C-b r), so without a reset the modules multiply each reload.
# Note: no `-F` flag on the module appends — -F expands at load time, when
# the tmux-battery vars can't resolve yet, and silently appends nothing.
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right ""
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -g @catppuccin_directory_text " #{pane_current_path}"
# Battery: point the catppuccin battery module straight at tmux-battery's
# scripts. The stock indirection (#{battery_*}) dies: tmux-battery only
# interpolates raw tokens it can see statically in status-* — not inside
# catppuccin's own options — so the icons resolved to nothing. Calling the
# scripts directly runs them on every bar refresh instead.
# (These @catppuccin_battery_* module defaults are only-if-unset (-o), so
# our overrides win when catppuccin loads.)
# (battery_percentage.sh already includes the "%" suffix)
set -g @catppuccin_battery_icon "#(~/.tmux/plugins/tmux-battery/scripts/battery_icon.sh) "
set -g @catppuccin_battery_text " #(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh)"
set -ag status-right "#{E:@catppuccin_status_battery}"

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
